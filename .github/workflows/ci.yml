name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt pytest

      - name: Run tests
        run: python -m pytest src/backend/tests/ -v

  frontend-lint:
    name: Frontend — Static Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file exists
        run: test -f src/frontend/index.html

      - name: Check JS file exists
        run: test -f src/frontend/app.js

      - name: Check CSS file exists
        run: test -f src/frontend/styles.css

  contracts-check:
    name: Contracts — Solidity Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install solhint
        run: npm install -g solhint

      - name: Run solhint
        run: solhint 'contracts/**/*.sol'
